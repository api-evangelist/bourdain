aid: bourdain

name: Bourdain

image: https://bourdain.io/og-image.png

description: Bourdain operates an agentic trading card marketplace that enables users to browse, buy, sell, and price trading cards such as Pokémon
  and One Piece. The platform offers AI‑driven search and filtering, seller analytics, and a roadmap for future features. It provides a modern
  web interface with pricing, terms, privacy, and support pages, aiming to bring confidence to card collectors and traders.

