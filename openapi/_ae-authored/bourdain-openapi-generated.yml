  /acp-confirm:
    post:
      operationId: post_acp_confirm
      tags:
      - Acp Confirm
      summary: Confirm and finalize order
      x-source: https://www.bourdain.io/docs/api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostAcpConfirmRequest'
      responses:
        '201':
          description: Success (status as documented)
          content:
