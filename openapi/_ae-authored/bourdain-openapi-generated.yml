  /acp-products:
    get:
      operationId: get_acp_products
      tags:
      - Acp Products
      summary: Search and filter listings
      x-source: https://www.bourdain.io/docs/api
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
        description: Search term (card name, set, etc.)
      - name: condition
        in: query
        required: false
        schema:
          type: string
        description: Mint, Near Mint, Excellent, Good, Played
      - name: rarity
        in: query
        required: false
        schema:
          type: string
        description: Common, Uncommon, Rare, Rare Holo, etc.
      - name: set
        in: query
        required: false
        schema:
          type: string
        description: Set code (e.g., sv7, base1)
      - name: min_price
        in: query
        required: false
        schema:
          type: number
        description: Minimum price in GBP
      - name: max_price
        in: query
        required: false
        schema:
          type: number
        description: Maximum price in GBP
      - name: trade_enabled
        in: query
        required: false
        schema:
          type: boolean
        description: Only show trade-eligible listings
      - name: limit
        in: query
        required: false
        schema:
          type: number
        description: 'Results per page (default: 20, max: 100)'
      - name: page
        in: query
        required: false
        schema:
          type: number
        description: Page number for pagination
      responses:
        '200':
          description: Success (status as documented)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAcpProductsResponse'
      x-evidence:
        kind: documentation
  /mcp-server:
    post:
      operationId: post_mcp_server
      tags:
      - Mcp Server
      summary: The Model Context Protocol is a standard for AI agents to interact with external services.
      description: All MCP requests use JSON-RPC 2.0 format sent to the single endpoint.
      x-source: https://www.bourdain.io/docs/mcp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostMcpServerRequest'
      responses:
        '200':
          description: Success (status as documented)
      x-evidence:
        kind: documentation
components:
  schemas:
    PostAcpCheckoutRequest:
      type: object
      properties:
        listing_id:
          type: string
          description: Listing to purchase
        shipping_address:
          type: object
          description: Delivery address
        buyer_email:
          type: string
          description: Email for order confirmation
      required:
      - listing_id
      - shipping_address
    PostAcpCheckoutResponse:
      type: object
      properties:
        success:
          type: boolean
        checkout_session_id:
          type: string
        payment_options:
          type: array
    PostAcpConfirmRequest:
      type: object
      properties:
        order_id:
          type: string
          description: Order ID from payment response
      required:
      - order_id
    PostAcpConfirmResponse:
      type: object
      properties:
        success:
          type: boolean
        status:
          type: string
          description: Final order status
    PostAcpPaymentRequest:
      type: object
      properties:
        checkout_session_id:
          type: string
          description: Session ID from checkout
        payment_method:
          type: string
          description: wallet, stripe, or split
        stripe_payment_method_id:
          type: string
          description: Required for stripe or split
      required:
      - checkout_session_id
      - payment_method
    PostAcpPaymentResponse:
      type: object
      properties:
        success:
          type: boolean
        order_id:
          type: string
    GetAcpProductIdResponse:
      type: object
      properties:
        success:
          type: boolean
        product:
          type: object
          description: Detailed product information
    GetAcpProductsResponse:
      type: object
      properties:
        success:
          type: boolean
        products:
          type: array
          description: List of product objects
        total_count:
          type: integer
        page:
          type: integer
        has_more:
          type: boolean
    PostMcpServerRequest:
      type: object
      properties:
        jsonrpc:
          type: string
          description: JSON-RPC version, always "2.0"
        id:
          type: string
          description: Unique request identifier
        method:
          type: string
          description: Tool name to invoke (e.g., "search_listings", "create_listing", etc.)
        params:
          type: object
          description: Tool‑specific parameters as documented for each method
      required:
      - jsonrpc
      - id
      - method
      - params
  securitySchemes:
    Authorization:
      type: apiKey
      in: header
      name: Authorization
      x-source: https://www.bourdain.io/docs/authentication
tags:
